[package]
name = "ppocr99"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# ONNX Runtime is loaded at run time (onnxruntime.dll / libonnxruntime.so next to the exe, or ORT_DYLIB_PATH):
# ort has no prebuilt binaries for x86_64-pc-windows-gnu, and loading Microsoft's official DLL works through the C API.
oar-ocr = { version = "0.10.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
serde_json = "1"
